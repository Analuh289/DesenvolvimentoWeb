<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de salario por peças</title>
    <link rel="stylesheet" href="main.css">
    <script src="java.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Controle de Produção e Salários</h2>

        <div class="formulario">
            <label for="nome">Nome do Funcionário:</label>
            <input type="text" id="nome">
        </div>

        <div class="formulario">
            <label for="pecas">Número de Peças Produzidas:</label>
            <input type="number" id="pecas">
        </div>
        
        <div class="botoes">
           <button type="button" id="adicionar">Calcular e Adicionar</button>
           <button type="button" id="limpar">Novo / Limpar</button>
           <button type="button" id="relatorio">Exibir Relatório Geral</button>
        </div>

        <div id="saida"></div>
    </div>
</body>
</html>
