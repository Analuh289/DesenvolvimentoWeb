<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média, Comissões e Relatórios</title>
    <link rel="stylesheet" href="main.css">
    <script src="java.js" defer></script>
</head>
<body>
    <h2>Média, Comissões e Relatórios</h2>
    <div class="formulario">
        <label for="nome">Nome do Funcionário:</label>
        <input type="text" id="nome">
    </div>
    <div class="formulario">
        <label for="vendas">Valor das Vendas:</label>
        <input type="number" id="vendas">
    </div>

    <div class="botoes">
        <button type="button" id="adicionar">Calcular e Adicionar</button>
        <button type="button" id="limpar">Novo / Limpar</button>
        <button type="button" id="relatorio">Exibir Relatório Geral</button>
    </div>
    
</body>
</html>
